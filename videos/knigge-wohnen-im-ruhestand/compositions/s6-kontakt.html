<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s6-kontakt-template">
      <style>
        @font-face {
          font-family: "Newsreader";
          src: url("assets/fonts/Newsreader-Italic-latin.woff2") format("woff2");
          font-style: italic;
          font-weight: 200 800;
        }
        #root {
          position: absolute !important;
          inset: 0 !important;
          width: 100% !important;
          height: 100% !important;
          container: scene / size;
          overflow: hidden;
          font-family: "Montserrat", sans-serif;
          color: #2a2725;
        }
        .s6-col {
          position: absolute;
          left: 8cqw;
          right: 8cqw;
          top: 10cqh;
          bottom: 9cqh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
        }
        .s6-logo {
          width: 63.3cqmin;
          height: 15cqmin;
          margin: 0 0 5cqmin;
        }
        .s6-logo svg {
          display: block;
          width: 100%;
          height: 100%;
          overflow: visible;
        }
        .s6-word {
          font-family: "Montserrat", sans-serif;
          fill: #2a2725;
        }
        .s6-k-outline {
          fill: none;
          stroke: #fffdf9;
          stroke-width: 2;
          stroke-dasharray: 1 2;
          stroke-dashoffset: 1.05;
        }
        .s6-invite {
          margin: 0 0 4.6cqmin;
          max-width: 80cqw;
          font-family: "Newsreader", serif;
          font-style: italic;
          font-weight: 400;
          font-size: 5.8cqmin;
          line-height: 1.15;
        }
        .s6-cup {
          display: inline-block;
          width: 1.05em;
          height: 1.05em;
          margin-right: 0.25em;
          vertical-align: -0.16em;
          overflow: visible;
        }
        .s6-cup path {
          fill: none;
          stroke: #c8102e;
          stroke-width: 1.8;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .s6-pill {
          position: relative;
          overflow: hidden;
          margin: 0 0 3.4cqmin;
          padding: 1.7cqmin 4.4cqmin 1.9cqmin;
          border-radius: 999px;
          background: #c8102e;
          color: #fffdf9;
          font-size: 4.4cqmin;
          font-weight: 700;
          letter-spacing: -0.01em;
          box-shadow: 0 1cqmin 2.4cqmin rgba(142, 21, 32, 0.25);
        }
        .s6-sheen {
          position: absolute;
          top: 0;
          bottom: 0;
          left: 0;
          width: 40%;
          background: linear-gradient(100deg, rgba(255, 253, 249, 0) 0%, rgba(255, 253, 249, 0.38) 50%, rgba(255, 253, 249, 0) 100%);
        }
        .s6-phone {
          display: flex;
          align-items: center;
          gap: 2cqmin;
          margin: 0 0 1.4cqmin;
          font-size: 6.4cqmin;
          font-weight: 700;
          letter-spacing: -0.01em;
          font-variant-numeric: tabular-nums;
        }
        .s6-phone svg {
          width: 5.4cqmin;
          height: 5.4cqmin;
          overflow: visible;
        }
        .s6-phone path {
          fill: #c8102e;
        }
        .s6-url {
          margin: 0 0 5cqmin;
          font-size: 4.2cqmin;
          font-weight: 400;
          color: #5f5a54;
        }
        .s6-claim {
          margin: 0;
          font-size: 3.6cqmin;
          font-weight: 700;
          letter-spacing: -0.01em;
        }
        .s6-red {
          color: #c8102e;
        }
        @container scene (orientation: portrait) {
          .s6-col {
            top: 14cqh;
            bottom: 22cqh;
          }
          .s6-logo {
            width: 60.8cqmin;
            height: 14.4cqmin;
            margin-bottom: 6cqmin;
          }
          .s6-invite {
            font-size: 6.2cqmin;
            margin-bottom: 6cqmin;
          }
          .s6-claim {
            font-size: 4cqmin;
          }
        }
        .w {
          display: inline-block;
        }
      </style>

      <div id="root" data-composition-id="s6-kontakt" data-width="1920" data-height="1080" data-duration="9">
        <div class="s6-col">
          <div class="s6-logo">
            <svg viewBox="0 0 422 100" role="img" aria-label="KNIGGE Immobilien" data-layout-allow-overlap>
              <defs>
                <linearGradient id="s6-k-l" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#a30f21" />
                  <stop offset="0.55" stop-color="#d4152d" />
                  <stop offset="1" stop-color="#e01b31" />
                </linearGradient>
                <linearGradient id="s6-k-r" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#6e0f17" />
                  <stop offset="1" stop-color="#9c1b24" />
                </linearGradient>
                <linearGradient id="s6-k-b" x1="0" y1="1" x2="1" y2="0.6">
                  <stop offset="0" stop-color="#8a0e1b" />
                  <stop offset="0.5" stop-color="#c8132b" />
                  <stop offset="1" stop-color="#de1a30" />
                </linearGradient>
              </defs>
              <path id="s6-f-l" d="M0 0 H62 L46 44 L0 100 Z" fill="url(#s6-k-l)" />
              <path id="s6-f-r" d="M62 0 H100 V100 L46 44 Z" fill="url(#s6-k-r)" />
              <path id="s6-f-b" d="M0 100 L46 44 L100 100 Z" fill="url(#s6-k-b)" />
              <path id="s6-k-outline" class="s6-k-outline" pathLength="1" d="M1 1 H99 V99 H1 Z" />
              <text class="s6-word" data-layout-allow-overlap id="s6-w1" x="125" y="53" font-size="64" font-weight="700" textLength="294" lengthAdjust="spacing">KNIGGE</text>
              <text class="s6-word" data-layout-allow-overlap id="s6-w2" x="126" y="97" font-size="41.5" font-weight="500" textLength="292" lengthAdjust="spacing">IMMOBILIEN</text>
            </svg>
          </div>

          <p class="s6-invite" id="s6-invite">
            <svg class="s6-cup" id="s6-cup" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 10 H17 V15 A5 5 0 0 1 12 20 H9 A5 5 0 0 1 4 15 Z M17 11.5 H19 A2.5 2.5 0 0 1 19 16.5 H16.6 M3 22 H18" />
              <path class="s6-steam" d="M8.5 7.5 C7.5 6 9.5 5 8.5 3" />
              <path class="s6-steam" d="M12.5 7.5 C11.5 6 13.5 5 12.5 3" />
            </svg>Lassen Sie uns sprechen – gern bei einer Tasse Kaffee.
          </p>

          <div class="s6-pill" id="s6-pill">
            Kostenloses Beratungsgespräch
            <div class="s6-sheen" id="s6-sheen" data-layout-allow-overflow></div>
          </div>

          <div class="s6-phone" id="s6-phone">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6.6 10.8 C8 13.6 10.4 16 13.2 17.4 L15.4 15.2 C15.7 14.9 16.1 14.8 16.5 15 C17.6 15.4 18.8 15.6 20 15.6 C20.6 15.6 21 16 21 16.6 V20 C21 20.6 20.6 21 20 21 C10.6 21 3 13.4 3 4 C3 3.4 3.4 3 4 3 H7.5 C8.1 3 8.5 3.4 8.5 4 C8.5 5.2 8.7 6.4 9.1 7.5 C9.2 7.9 9.1 8.3 8.8 8.6 Z" />
            </svg>
            <span>02202 12 40 300</span>
          </div>
          <p class="s6-url" id="s6-url">knigge-immobilien.de</p>
          <p class="s6-claim" id="s6-claim">Nicht weniger Zuhause. <span class="s6-red">Mehr Leben.</span></p>
        </div>
      </div>

      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="s6-kontakt"]');
          const $ = (s) => root.querySelector(s);
          const tl = gsap.timeline({ paused: true });

          // Bildmarke faltet sich zusammen (logo-assemble-lockup)
          tl.fromTo("#s6-f-l", { opacity: 0, x: -70, y: -36 }, { opacity: 1, x: 0, y: 0, duration: 0.85, ease: "power3.out" }, 0.35);
          tl.fromTo("#s6-f-r", { opacity: 0, x: 70, y: -30 }, { opacity: 1, x: 0, y: 0, duration: 0.85, ease: "power3.out" }, 0.45);
          tl.fromTo("#s6-f-b", { opacity: 0, x: 0, y: 64 }, { opacity: 1, x: 0, y: 0, duration: 0.85, ease: "power3.out" }, 0.55);
          tl.fromTo("#s6-k-outline", { strokeDashoffset: 1.05 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 1.25);
          tl.fromTo("#s6-w1", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 1.0);
          tl.fromTo("#s6-w2", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 1.2);

          // Einladung (Reziprozität, kleiner erster Schritt)
          tl.fromTo("#s6-invite", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" }, 1.95);
          root.querySelectorAll(".s6-steam").forEach((s, i) => {
            for (let c = 0; c < 3; c++) {
              const t = 2.4 + i * 0.45 + c * 1.5;
              tl.fromTo(s, { opacity: 0, y: 1.5 }, { opacity: 1, y: 0, duration: 0.6, ease: "sine.out", immediateRender: c === 0 }, t);
              tl.to(s, { opacity: 0, y: -2, duration: 0.7, ease: "sine.in" }, t + 0.6);
            }
          });

          // CTA
          tl.fromTo("#s6-pill", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.8)" }, 3.2);
          tl.fromTo("#s6-phone", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.6);
          tl.fromTo("#s6-url", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.9);
          // sanfter "Druck" + Glanz auf dem Button (physics-press-reaction)
          tl.to("#s6-pill", { scale: 0.96, duration: 0.12, ease: "power2.in" }, 4.7);
          tl.to("#s6-pill", { scale: 1, duration: 0.45, ease: "back.out(3)" }, 4.82);
          tl.fromTo("#s6-sheen", { xPercent: -120 }, { xPercent: 280, duration: 1.1, ease: "power2.inOut" }, 4.75);
          tl.fromTo("#s6-claim", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 5.1);
          tl.fromTo("#s6-sheen", { xPercent: -120 }, { xPercent: 280, duration: 1.1, ease: "power2.inOut", immediateRender: false }, 7.0);

          window.__timelines["s6-kontakt"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
