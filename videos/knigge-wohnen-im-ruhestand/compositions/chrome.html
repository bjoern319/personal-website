<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="chrome-template">
      <style>
        #root {
          position: absolute !important;
          inset: 0 !important;
          width: 100% !important;
          height: 100% !important;
          container: scene / size;
          overflow: hidden;
          font-family: "Montserrat", sans-serif;
          color: #2a2725;
        }
        /* Logo-Bug (klein, oben links; im Hochformat oben mittig) */
        .ch-bug {
          position: absolute;
          left: 4cqw;
          top: 5.6cqh;
          height: 5.4cqmin;
          width: 22.8cqmin;
        }
        .ch-bug-inner {
          width: 100%;
          height: 100%;
        }
        .ch-bug svg {
          display: block;
          width: 100%;
          height: 100%;
          overflow: visible;
        }
        @container scene (orientation: portrait) {
          .ch-bug {
            left: calc(50cqw - 13.3cqmin);
            top: 7.2cqh;
            height: 6.3cqmin;
            width: 26.6cqmin;
          }
        }
        .ch-word {
          font-family: "Montserrat", sans-serif;
          fill: #2a2725;
        }
        /* Brand-Wipe: zwei diagonale Bahnen in KNIGGE-Rot / Bordeaux (K-Faltung) */
        .ch-wipe {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        .ch-pane {
          position: absolute;
          top: 0;
          bottom: 0;
          left: 0;
          width: 220cqw;
          clip-path: polygon(20% 0, 100% 0, 80% 100%, 0 100%);
        }
        .ch-pane-red {
          background: #c8102e;
        }
        .ch-pane-deep {
          background: #8e1520;
        }
      </style>

      <div id="root" data-composition-id="chrome" data-width="1920" data-height="1080" data-duration="75">
        <div class="ch-bug">
          <div class="ch-bug-inner" id="ch-bug" data-layout-allow-overlap>
            <svg viewBox="0 0 422 100" role="img" aria-label="KNIGGE Immobilien" data-layout-allow-overlap>
              <defs>
                <linearGradient id="ch-k-l" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#a30f21" />
                  <stop offset="0.55" stop-color="#d4152d" />
                  <stop offset="1" stop-color="#e01b31" />
                </linearGradient>
                <linearGradient id="ch-k-r" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#6e0f17" />
                  <stop offset="1" stop-color="#9c1b24" />
                </linearGradient>
                <linearGradient id="ch-k-b" x1="0" y1="1" x2="1" y2="0.6">
                  <stop offset="0" stop-color="#8a0e1b" />
                  <stop offset="0.5" stop-color="#c8132b" />
                  <stop offset="1" stop-color="#de1a30" />
                </linearGradient>
              </defs>
              <path d="M0 0 H62 L46 44 L0 100 Z" fill="url(#ch-k-l)" />
              <path d="M62 0 H100 V100 L46 44 Z" fill="url(#ch-k-r)" />
              <path d="M0 100 L46 44 L100 100 Z" fill="url(#ch-k-b)" />
              <path d="M1 1 H99 V99 H1 Z" fill="none" stroke="#fffdf9" stroke-width="2" />
              <text class="ch-word" data-layout-allow-overlap x="125" y="53" font-size="64" font-weight="700" textLength="294" lengthAdjust="spacing">KNIGGE</text>
              <text class="ch-word" data-layout-allow-overlap x="126" y="97" font-size="41.5" font-weight="500" textLength="292" lengthAdjust="spacing">IMMOBILIEN</text>
            </svg>
          </div>
        </div>

        <div class="ch-wipe">
          <div class="ch-pane ch-pane-deep" id="ch-w1-deep"></div>
          <div class="ch-pane ch-pane-red" id="ch-w1-red"></div>
        </div>
        <div class="ch-wipe">
          <div class="ch-pane ch-pane-deep" id="ch-w2-deep"></div>
          <div class="ch-pane ch-pane-red" id="ch-w2-red"></div>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });

          // Logo-Bug: sanft ein, bleibt bis zum großen Logo-Abschluss
          tl.fromTo("#ch-bug", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.9, ease: "power2.out" }, 0.8);
          tl.to("#ch-bug", { opacity: 0, duration: 0.5, ease: "power1.in" }, 65.0);

          // Brand-Wipe: Bahn läuft von rechts nach links; bei xPercent -27 ist das Bild voll bedeckt.
          function wipe(redSel, deepSel, cut) {
            tl.fromTo(deepSel, { xPercent: 46 }, { xPercent: -27, duration: 0.42, ease: "power2.in", immediateRender: true }, cut - 0.48);
            tl.to(deepSel, { xPercent: -100, duration: 0.5, ease: "power2.out" }, cut - 0.06);
            tl.fromTo(redSel, { xPercent: 46 }, { xPercent: -27, duration: 0.42, ease: "power2.in", immediateRender: true }, cut - 0.42);
            tl.to(redSel, { xPercent: -100, duration: 0.5, ease: "power2.out" }, cut);
          }
          wipe("#ch-w1-red", "#ch-w1-deep", 45.0);
          wipe("#ch-w2-red", "#ch-w2-deep", 66.0);

          window.__timelines["chrome"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
